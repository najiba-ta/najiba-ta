name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # প্রতি ১২ ঘণ্টা পর অটো আপডেট হবে
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: najiba-ta
          outputs: |
            dist/snake.svg?color_snake=#1b4721&color_dots=#e8f5e9,#a5d6a7,#66bb6a,#43a047,#2e7d32
            dist/snake-dark.svg?color_snake=#2e7d32&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
