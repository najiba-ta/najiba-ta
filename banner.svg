<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Atmospheric Gradient -->
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0f1d30" stop-opacity="0.7">
        <animate attributeName="stop-color" values="#0f1d30;#11252b;#0f1d30" dur="14s" repeatCount="indefinite" />
      </stop>
      <stop offset="60%" stop-color="#090c10" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#06080b" stop-opacity="1" />
    </radialGradient>

    <!-- Subtle Radial Accent Glow on Right -->
    <radialGradient id="accentGlow" cx="80%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12">
        <animate attributeName="stop-opacity" values="0.08;0.16;0.08" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#08090b" stop-opacity="0" />
    </radialGradient>

    <!-- Architectural Grid Pattern -->
    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>

    <!-- Subtle Scanline / Line pattern -->
    <linearGradient id="lineFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseNode {
        0%, 100% { r: 3; opacity: 0.4; }
        50% { r: 4.5; opacity: 0.9; }
      }
      .cursor { animation: blink 1.1s infinite; }
      .floating-geo { animation: floatSlow 9s ease-in-out infinite; }
      .node-pulse { animation: pulseNode 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="#080a0e" />
  <rect width="1200" height="420" fill="url(#ambientGlow)" />
  <rect width="1200" height="420" fill="url(#accentGlow)" />
  <rect width="1200" height="420" fill="url(#archGrid)" />

  <!-- Subtle Horizon Accent Line -->
  <line x1="80" y1="419" x2="1120" y2="419" stroke="url(#lineFade)" stroke-width="1" />

  <!-- Background Architecture & Code Geometry (Right Side) -->
  <g class="floating-geo" opacity="0.35">
    <!-- Isometric Grid Architecture -->
    <path d="M 880 110 L 1020 40 L 1140 100 L 1000 170 Z" fill="none" stroke="#64748b" stroke-width="0.75" stroke-dasharray="3 3" />
    <path d="M 1000 170 L 1000 310 L 1140 240 L 1140 100 Z" fill="none" stroke="#64748b" stroke-width="0.75" />
    <path d="M 880 110 L 880 250 L 1000 310" fill="none" stroke="#38bdf8" stroke-width="0.85" stroke-opacity="0.7" />

    <path d="M 760 170 L 880 110 L 960 150 L 840 210 Z" fill="none" stroke="#64748b" stroke-width="0.6" stroke-dasharray="2 2" />
    <path d="M 840 210 L 840 330 L 960 270 L 960 150 Z" fill="none" stroke="#64748b" stroke-width="0.6" />

    <!-- Node connection lines -->
    <line x1="880" y1="110" x2="1000" y2="170" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <line x1="1000" y1="170" x2="1020" y2="40" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.4" />

    <!-- Glowing Nodes -->
    <circle cx="880" cy="110" r="3.5" fill="#38bdf8" class="node-pulse" />
    <circle cx="1000" cy="170" r="4" fill="#38bdf8" />
    <circle cx="1140" cy="100" r="3" fill="#64748b" opacity="0.6" />
    <circle cx="1000" cy="310" r="3.5" fill="#38bdf8" opacity="0.7" />
    <circle cx="840" cy="210" r="3" fill="#38bdf8" opacity="0.5" />

    <!-- Subtle Faint Code Snippet Watermark -->
    <g opacity="0.22" transform="translate(730, 290)">
      <text font-family="'SF Mono', 'Fira Code', Menlo, monospace" font-size="11" fill="#94a3b8" letter-spacing="0.5">
        <tspan x="0" y="0">const architecture = {</tspan>
        <tspan x="18" y="18">runtime: "Next.js + Node",</tspan>
        <tspan x="18" y="36">persistence: "MongoDB",</tspan>
        <tspan x="18" y="54">precision: "pixel-perfect"</tspan>
        <tspan x="0" y="72">};</tspan>
      </text>
    </g>
  </g>

  <!-- Left / Center Content -->
  <g transform="translate(100, 80)">
    <!-- Status Indicator Pill -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="220" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
      <circle cx="15" cy="13" r="4" fill="#38bdf8" class="node-pulse" />
      <text x="28" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8" letter-spacing="1.5">FULL-STACK WORKSPACE</text>
    </g>

    <!-- Developer Name -->
    <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="700" fill="#f8fafc" letter-spacing="5">
      NAJIBA TAKARRUM
    </text>

    <!-- Subtitle / Role -->
    <text x="2" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="15" font-weight="600" fill="#38bdf8" letter-spacing="5">
      FULL-STACK DEVELOPER
    </text>

    <!-- Subtle Divider -->
    <line x1="2" y1="168" x2="420" y2="168" stroke="#334155" stroke-width="1" stroke-opacity="0.4" />

    <!-- Philosophy Tagline with Blinking Cursor -->
    <text x="2" y="198" font-family="'SF Mono', 'Fira Code', Menlo, monospace" font-size="13.5" fill="#94a3b8" letter-spacing="0.5">
      Building quietly. Solving deeply. Shipping intentionally.<tspan fill="#38bdf8" font-weight="bold" class="cursor">_</tspan>
    </text>

    <!-- Stack Chips -->
    <g transform="translate(2, 222)">
      <g transform="translate(0, 0)">
        <rect width="68" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
        <text x="34" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">React</text>
      </g>
      <g transform="translate(76, 0)">
        <rect width="76" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
        <text x="38" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Next.js</text>
      </g>
      <g transform="translate(160, 0)">
        <rect width="78" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
        <text x="39" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Node.js</text>
      </g>
      <g transform="translate(246, 0)">
        <rect width="84" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
        <text x="42" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Express.js</text>
      </g>
      <g transform="translate(338, 0)">
        <rect width="82" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
        <text x="41" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">MongoDB</text>
      </g>
    </g>
  </g>
</svg>
