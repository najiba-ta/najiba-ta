<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="heroSky" cx="75%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#121829" />
      <stop offset="45%" stop-color="#0a0e1a" />
      <stop offset="100%" stop-color="#05070c" />
    </radialGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35">
        <animate attributeName="stop-opacity" values="0.25;0.45;0.25" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Laptop Screen Glow -->
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25">
        <animate attributeName="stop-opacity" values="0.2;0.35;0.2" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Name Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <style>
      @keyframes floatUp {
        0%, 100% { transform: translateY(0px); opacity: 0.3; }
        50% { transform: translateY(-10px); opacity: 0.8; }
      }
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pulseBar {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      .star-1 { animation: floatUp 6s ease-in-out infinite; }
      .star-2 { animation: floatUp 8s ease-in-out infinite 2s; }
      .star-3 { animation: floatUp 7s ease-in-out infinite 4s; }
      .cursor { animation: cursorBlink 1s infinite; }
      .accent-bar { animation: pulseBar 2.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="1000" height="460" rx="16" fill="url(#heroSky)" />
  <rect width="1000" height="460" rx="16" fill="none" stroke="#1b2433" stroke-width="1.2" />

  <!-- Background Floating Light Particles -->
  <circle cx="200" cy="80" r="1.5" fill="#38bdf8" class="star-1" />
  <circle cx="450" cy="140" r="1.2" fill="#818cf8" class="star-2" />
  <circle cx="350" cy="380" r="1.8" fill="#38bdf8" class="star-3" />
  <circle cx="580" cy="70" r="1.5" fill="#f8fafc" class="star-1" />
  <circle cx="920" cy="180" r="1.5" fill="#38bdf8" class="star-2" />

  <!-- ================= RIGHT COLUMN: NIGHT WORKSPACE SCENE ================= -->
  <g transform="translate(560, 30)">
    <!-- Window Frame -->
    <rect x="90" y="20" width="310" height="340" rx="10" fill="#060913" stroke="#161f30" stroke-width="1.5" />
    <!-- Window Crossbars -->
    <line x1="245" y1="20" x2="245" y2="360" stroke="#111827" stroke-width="2" />
    <line x1="90" y1="180" x2="400" y2="180" stroke="#111827" stroke-width="2" />

    <!-- City Skyline Silhouette outside window -->
    <path d="M 110 320 L 130 260 L 150 260 L 160 280 L 190 240 L 210 240 L 230 300 L 260 270 L 280 270 L 300 290 L 330 250 L 350 250 L 380 320 Z" fill="#0d1424" />
    
    <!-- City Lights / Bokeh Outside -->
    <circle cx="140" cy="275" r="1.8" fill="#f59e0b" opacity="0.6" />
    <circle cx="175" cy="290" r="1.5" fill="#38bdf8" opacity="0.5" />
    <circle cx="200" cy="255" r="2" fill="#f59e0b" opacity="0.7" />
    <circle cx="270" cy="285" r="1.5" fill="#f43f5e" opacity="0.5" />
    <circle cx="340" cy="265" r="2" fill="#38bdf8" opacity="0.6" />

    <!-- Crescent Moon outside window -->
    <path d="M 340 70 A 14 14 0 0 0 325 88 A 12 12 0 0 1 336 72 Z" fill="#f8fafc" opacity="0.85" />

    <!-- Desk Surface -->
    <rect x="40" y="360" width="380" height="12" rx="2" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />

    <!-- Warm Desk Lamp (Right side of desk) -->
    <!-- Lamp Glow Aura -->
    <circle cx="330" cy="270" r="130" fill="url(#lampGlow)" />
    <!-- Lamp Stand -->
    <path d="M 370 360 L 360 260 L 330 250" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <!-- Lamp Shade -->
    <path d="M 315 240 L 345 250 L 335 268 L 310 255 Z" fill="#e2e8f0" opacity="0.9" />
    <!-- Lamp Light Bulb Core -->
    <circle cx="325" cy="262" r="5" fill="#fef08a" />

    <!-- Laptop on Desk (Center/Left) -->
    <!-- Screen Glow Aura -->
    <circle cx="190" cy="310" r="80" fill="url(#screenGlow)" />
    <!-- Laptop Base -->
    <rect x="140" y="352" width="100" height="6" rx="2" fill="#334155" />
    <!-- Laptop Screen -->
    <rect x="150" y="278" width="80" height="74" rx="4" fill="#090d16" stroke="#475569" stroke-width="1" />
    <!-- Miniature Code Lines on Laptop Screen -->
    <rect x="156" y="286" width="32" height="2" rx="1" fill="#c084fc" />
    <rect x="192" y="286" width="22" height="2" rx="1" fill="#38bdf8" />
    <rect x="160" y="293" width="40" height="2" rx="1" fill="#34d399" />
    <rect x="160" y="300" width="28" height="2" rx="1" fill="#94a3b8" />
    <rect x="164" y="307" width="48" height="2" rx="1" fill="#38bdf8" />
    <rect x="160" y="314" width="34" height="2" rx="1" fill="#f59e0b" />
    <rect x="156" y="321" width="18" height="2" rx="1" fill="#c084fc" />

    <!-- Coffee Mug on Desk -->
    <rect x="260" y="338" width="16" height="22" rx="2" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <path d="M 276 343 C 282 343 282 355 276 355" fill="none" stroke="#334155" stroke-width="1" />
    <!-- Faint Steam from Mug -->
    <path d="M 265 332 Q 268 324 265 316" fill="none" stroke="#94a3b8" stroke-width="0.75" opacity="0.4" />
    <path d="M 271 330 Q 274 322 271 314" fill="none" stroke="#94a3b8" stroke-width="0.75" opacity="0.4" />

    <!-- Plant Silhouette on Left of Desk -->
    <path d="M 80 345 Q 85 325 75 310 Q 90 325 85 345 Z" fill="#162032" />
    <path d="M 85 345 Q 98 328 105 318 Q 95 332 85 345 Z" fill="#162032" />
    <path d="M 85 345 Q 70 335 60 330 Q 75 340 85 345 Z" fill="#162032" />
    <!-- Pot -->
    <polygon points="76,345 94,345 90,360 80,360" fill="#1e293b" />

    <!-- Upper Right Inspiration Text -->
    <g transform="translate(340, 20)">
      <text font-family="'Playfair Display', Georgia, serif" font-size="16" fill="#cbd5e1" letter-spacing="1">
        <tspan x="0" y="0">Better</tspan>
        <tspan x="0" y="22">Code</tspan>
        <tspan x="0" y="44">Bigger</tspan>
        <tspan x="0" y="66" fill="#38bdf8">Dreams</tspan>
      </text>
    </g>
  </g>

  <!-- ================= LEFT COLUMN: HERO IDENTITY & TYPOGRAPHY ================= -->
  <g transform="translate(60, 60)">
    <!-- Tag -->
    <text x="0" y="24" font-family="'SF Mono', 'Fira Code', Menlo, monospace" font-size="12" fill="#64748b" letter-spacing="2">
      &lt; developer / full-stack /&gt;
    </text>

    <!-- First Name: Najiba -->
    <text x="0" y="90" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="56" font-weight="600" fill="url(#titleGrad)" letter-spacing="2">
      Najiba
    </text>

    <!-- Last Name: Takarrum (Indented) -->
    <text x="68" y="152" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="56" font-weight="600" fill="url(#titleGrad)" letter-spacing="2">
      Takarrum
    </text>

    <!-- Role with Glowing Cyan Accent Bar -->
    <g transform="translate(0, 186)">
      <rect x="0" y="3" width="3.5" height="16" rx="1.5" fill="#38bdf8" class="accent-bar" />
      <text x="16" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" letter-spacing="3">
        FRONTEND DEVELOPER &nbsp;•&nbsp; FULL-STACK DEVELOPER
      </text>
    </g>

    <!-- Tagline with Blinking Cursor -->
    <g transform="translate(0, 230)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#94a3b8" letter-spacing="0.5">
        Building thoughtful interfaces and reliable web systems.<tspan dx="4" fill="#38bdf8" font-weight="bold" class="cursor">_</tspan>
      </text>
    </g>

    <!-- 4 Elegant Pill Buttons -->
    <g transform="translate(0, 268)">
      <!-- GitHub Pill -->
      <g transform="translate(0, 0)">
        <rect width="90" height="32" rx="16" fill="#0d131f" stroke="#222f44" stroke-width="1" />
        <path d="M 22 16 C 22 12.7 19.3 10 16 10 C 12.7 10 10 12.7 10 16 C 10 18.6 11.7 20.8 14.1 21.6 C 14.4 21.7 14.5 21.5 14.5 21.3 L 14.5 20.1 C 12.8 20.4 12.5 19.3 12.5 19.3 C 12.2 18.6 11.8 18.4 11.8 18.4 C 11.2 18 12.2 18 12.2 18 C 12.9 18.1 13.2 18.7 13.2 18.7 C 13.8 19.6 14.7 19.4 15 19.2 C 15.1 18.7 15.3 18.4 15.5 18.2 C 14.2 18.1 12.7 17.5 12.7 15.4 C 12.7 14.8 12.9 14.3 13.3 13.9 C 13.2 13.7 13 13.1 13.4 12.3 C 13.4 12.3 13.9 12.1 15 12.9 C 15.5 12.8 16 12.7 16.5 12.7 C 17 12.7 17.5 12.8 18 12.9 C 19.1 12.1 19.6 12.3 19.6 12.3 C 20 13.1 19.8 13.7 19.7 13.9 C 20.1 14.3 20.3 14.8 20.3 15.4 C 20.3 17.5 18.8 18.1 17.5 18.2 C 17.7 18.4 17.9 18.8 17.9 19.5 L 17.9 21.3 C 17.9 21.5 18 21.7 18.3 21.6 C 20.7 20.8 22.4 18.6 22.4 16 Z" fill="#f8fafc" transform="translate(6, 0)" />
        <text x="38" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#f8fafc">GitHub</text>
      </g>

      <!-- LinkedIn Pill -->
      <g transform="translate(100, 0)">
        <rect width="98" height="32" rx="16" fill="#0d131f" stroke="#222f44" stroke-width="1" />
        <text x="18" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">in</text>
        <text x="36" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#f8fafc">LinkedIn</text>
      </g>

      <!-- Portfolio Pill -->
      <g transform="translate(208, 0)">
        <rect width="96" height="32" rx="16" fill="#0d131f" stroke="#222f44" stroke-width="1" />
        <circle cx="20" cy="16" r="6" fill="none" stroke="#38bdf8" stroke-width="1.2" />
        <line x1="14" y1="16" x2="26" y2="16" stroke="#38bdf8" stroke-width="1" />
        <text x="34" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#f8fafc">Portfolio</text>
      </g>

      <!-- Email Pill -->
      <g transform="translate(314, 0)">
        <rect width="86" height="32" rx="16" fill="#0d131f" stroke="#222f44" stroke-width="1" />
        <rect x="14" y="11" width="12" height="10" rx="1.5" fill="none" stroke="#f43f5e" stroke-width="1.2" />
        <polyline points="14,12 20,16 26,12" fill="none" stroke="#f43f5e" stroke-width="1.2" />
        <text x="32" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#f8fafc">Email</text>
      </g>
    </g>
  </g>
</svg>
