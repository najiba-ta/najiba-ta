<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#080a0f" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222f44" />
      <stop offset="50%" stop-color="#161f2e" />
      <stop offset="100%" stop-color="#0f1622" />
    </linearGradient>

    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .sec-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #f8fafc; letter-spacing: 0.5px; }
      .term-tag { font-family: 'SF Mono', 'Fira Code', Menlo, monospace; font-size: 13px; font-weight: 500; fill: #38bdf8; }
      .term-cmd { font-family: 'SF Mono', 'Fira Code', Menlo, monospace; font-size: 11.5px; fill: #64748b; }
      .term-val { font-family: 'SF Mono', 'Fira Code', Menlo, monospace; font-size: 12px; fill: #e2e8f0; font-weight: 500; }
      .term-val-cyan { font-family: 'SF Mono', 'Fira Code', Menlo, monospace; font-size: 12px; fill: #7dd3fc; font-weight: 500; }
      .term-cursor { animation: blink 1s infinite; fill: #38bdf8; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; fill: #94a3b8; line-height: 1.5; }
      .focus-arrow { font-family: 'SF Mono', 'Fira Code', Menlo, monospace; font-size: 12px; fill: #38bdf8; }
      .focus-item { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; fill: #cbd5e1; }
      .goal-highlight { font-weight: 600; fill: #38bdf8; }
    </style>
  </defs>

  <!-- Left Column Header -->
  <text x="10" y="24" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#64748b">/ whoami</text>

  <!-- LEFT COLUMN: Terminal Card -->
  <g transform="translate(10, 42)">
    <!-- Terminal Outer Box -->
    <rect width="455" height="420" rx="12" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" />

    <!-- Terminal Header Line -->
    <circle cx="24" cy="24" r="4.5" fill="#10b981" />
    <text x="38" y="28" class="term-tag">najiba@workspace:~$</text>
    <line x1="16" y1="44" x2="439" y2="44" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3 3" />

    <!-- Prompt 1: whoami -->
    <g transform="translate(24, 68)">
      <text x="0" y="0" class="term-cmd">&gt; whoami</text>
      <text x="12" y="18" class="term-val">Najiba Takarrum</text>
    </g>

    <!-- Prompt 2: role -->
    <g transform="translate(24, 120)">
      <text x="0" y="0" class="term-cmd">&gt; role</text>
      <text x="12" y="18" class="term-val">Frontend Developer &nbsp;/&nbsp; Full-Stack Developer</text>
    </g>

    <!-- Prompt 3: mindset -->
    <g transform="translate(24, 172)">
      <text x="0" y="0" class="term-cmd">&gt; mindset</text>
      <text x="12" y="18" class="term-val">Focused &nbsp;•&nbsp; Curious &nbsp;•&nbsp; Analytical &nbsp;•&nbsp; Quiet &nbsp;•&nbsp; Persistent</text>
    </g>

    <!-- Prompt 4: craft -->
    <g transform="translate(24, 224)">
      <text x="0" y="0" class="term-cmd">&gt; craft</text>
      <text x="12" y="18" class="term-val">Clean UI &nbsp;•&nbsp; Scalable Systems &nbsp;•&nbsp; Problem Solver</text>
    </g>

    <!-- Prompt 5: location -->
    <g transform="translate(24, 276)">
      <text x="0" y="0" class="term-cmd">&gt; location</text>
      <text x="12" y="18" class="term-val">Bangladesh</text>
    </g>

    <!-- Prompt 6: echo $goal -->
    <g transform="translate(24, 328)">
      <text x="0" y="0" class="term-cmd">&gt; echo $goal</text>
      <text x="12" y="20" class="term-val-cyan">Software Engineer (Insha Allah) →<tspan dx="5" class="term-cursor">█</tspan></text>
    </g>
  </g>

  <!-- RIGHT COLUMN: About, Focus, Goal -->
  <g transform="translate(495, 30)">
    <!-- BLOCK 1: About Me -->
    <g transform="translate(0, 0)">
      <!-- Icon -->
      <g transform="translate(0, 2)">
        <path d="M 4 12 A 5 5 0 0 1 14 12 A 5 5 0 0 1 4 12 Z M 2 19 A 7 7 0 0 1 16 19" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round" />
      </g>
      <text x="24" y="14" class="sec-title">About Me</text>
      
      <text x="24" y="38" class="body-txt">
        <tspan x="24" dy="0">I build modern web applications with a strong focus on clean</tspan>
        <tspan x="24" dy="17">interfaces, thoughtful architecture, and practical user experience.</tspan>
        <tspan x="24" dy="24">I learn by building real products, breaking things, understanding</tspan>
        <tspan x="24" dy="17">why they broke, and methodically refining them.</tspan>
      </text>
    </g>

    <!-- BLOCK 2: Current Focus -->
    <g transform="translate(0, 142)">
      <!-- Compass / Target Icon -->
      <g transform="translate(0, 2)">
        <circle cx="9" cy="9" r="7" fill="none" stroke="#38bdf8" stroke-width="1.4" />
        <circle cx="9" cy="9" r="2.5" fill="#38bdf8" />
      </g>
      <text x="24" y="14" class="sec-title">Current Focus</text>

      <g transform="translate(24, 34)">
        <text x="0" y="0" class="focus-arrow">→</text> <text x="16" y="0" class="focus-item">Full-Stack Web Development</text>
        <text x="0" y="20" class="focus-arrow">→</text> <text x="16" y="20" class="focus-item">React &amp; Next.js Interfaces</text>
        <text x="0" y="40" class="focus-arrow">→</text> <text x="16" y="40" class="focus-item">REST APIs &amp; Authentication Systems</text>
        <text x="0" y="60" class="focus-arrow">→</text> <text x="16" y="60" class="focus-item">Backend Architecture &amp; Database Design</text>
        <text x="0" y="80" class="focus-arrow">→</text> <text x="16" y="80" class="focus-item">AI-assisted Development Workflows</text>
        <text x="0" y="100" class="focus-arrow">→</text> <text x="16" y="100" class="focus-item">Writing cleaner, maintainable &amp; testable code</text>
      </g>
    </g>

    <!-- BLOCK 3: Future Goal -->
    <g transform="translate(0, 310)">
      <!-- Star / Sparkle Icon -->
      <g transform="translate(0, 2)">
        <path d="M 9 2 L 11 7 L 16 9 L 11 11 L 9 16 L 7 11 L 2 9 L 7 7 Z" fill="#38bdf8" opacity="0.9" />
      </g>
      <text x="24" y="14" class="sec-title">Future Goal</text>

      <text x="24" y="38" class="body-txt">
        <tspan x="24" dy="0">To become a <tspan class="goal-highlight">Software Engineer</tspan> and build meaningful,</tspan>
        <tspan x="24" dy="18">reliable products. <tspan fill="#38bdf8">Insha Allah.</tspan></tspan>
      </text>
    </g>
  </g>
</svg>
