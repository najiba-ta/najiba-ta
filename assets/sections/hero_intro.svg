<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="100%" height="100%">
  <defs>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="accentBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <style>
      @keyframes fadeIn {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      .tag { font-family: 'SF Mono', 'Fira Code', Menlo, monospace; font-size: 11px; fill: #64748b; letter-spacing: 2px; }
      .name-1 { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; font-size: 46px; font-weight: 600; fill: url(#nameGrad); letter-spacing: 1px; }
      .name-2 { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; font-size: 46px; font-weight: 600; fill: url(#nameGrad); letter-spacing: 1px; }
      .role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; font-weight: 600; fill: #94a3b8; letter-spacing: 3px; }
      .tagline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; fill: #64748b; letter-spacing: 0.5px; }
      .fade-1 { animation: fadeIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .fade-2 { animation: fadeIn 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .fade-3 { animation: fadeIn 1.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .accent-pulse { animation: pulseGlow 3s ease-in-out infinite; }
    </style>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Small Category Label -->
    <text x="0" y="20" class="tag fade-1">&lt; developer / full-stack /&gt;</text>

    <!-- First Name -->
    <text x="0" y="70" class="name-1 fade-1">Najiba</text>

    <!-- Last Name (Indented) -->
    <text x="56" y="118" class="name-2 fade-1">Takarrum</text>

    <!-- Role with Cyan Accent Bar -->
    <g transform="translate(0, 142)" class="fade-2">
      <rect x="0" y="2" width="3" height="14" rx="1.5" fill="url(#accentBarGrad)" class="accent-pulse" />
      <text x="14" y="14" class="role">FRONTEND DEVELOPER &nbsp;•&nbsp; FULL-STACK DEVELOPER</text>
    </g>

    <!-- Tagline -->
    <g transform="translate(0, 178)" class="fade-3">
      <text x="0" y="14" class="tagline">Building thoughtfully. Learning deeply. Improving continuously.</text>
    </g>
  </g>
</svg>
