<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 125" width="100%" height="100%">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <style>
      .foot-heading { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 600; fill: #f8fafc; letter-spacing: 0.5px; }
      .pill-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 500; fill: #f8fafc; }
    </style>
  </defs>

  <!-- Top: Call to Action -->
  <text x="500" y="28" text-anchor="middle" class="foot-heading">Let's build something meaningful.</text>

  <!-- Centered 4 Social Pills -->
  <g transform="translate(305, 46)">
    <!-- GitHub -->
    <g transform="translate(0, 0)">
      <rect width="90" height="30" rx="15" fill="#0d131f" stroke="#222f44" stroke-width="1" />
      <text x="45" y="19" text-anchor="middle" class="pill-lbl">GitHub</text>
    </g>
    <!-- LinkedIn -->
    <g transform="translate(98, 0)">
      <rect width="96" height="30" rx="15" fill="#0d131f" stroke="#222f44" stroke-width="1" />
      <text x="48" y="19" text-anchor="middle" class="pill-lbl">LinkedIn</text>
    </g>
    <!-- Portfolio -->
    <g transform="translate(202, 0)">
      <rect width="96" height="30" rx="15" fill="#0d131f" stroke="#222f44" stroke-width="1" />
      <text x="48" y="19" text-anchor="middle" class="pill-lbl">Portfolio</text>
    </g>
    <!-- Email -->
    <g transform="translate(306, 0)">
      <rect width="84" height="30" rx="15" fill="#0d131f" stroke="#222f44" stroke-width="1" />
      <text x="42" y="19" text-anchor="middle" class="pill-lbl">Email</text>
    </g>
  </g>

  <!-- Glowing Cosmic Wave Trails Weaving Across the Footer (Matching Mockup) -->
  <g transform="translate(0, 20)">
    <path d="M 0 85 Q 250 135 500 75 T 1000 80" fill="none" stroke="url(#waveGrad)" stroke-width="1.5" />
    <path d="M 0 95 Q 280 55 520 100 T 1000 90" fill="none" stroke="url(#waveGrad2)" stroke-width="1.2" stroke-dasharray="4 4" />
    
    <!-- Floating tiny nodes on the trail -->
    <circle cx="210" cy="98" r="2" fill="#38bdf8" />
    <circle cx="480" cy="80" r="2.5" fill="#818cf8" />
    <circle cx="740" cy="93" r="2" fill="#38bdf8" />
  </g>
</svg>
